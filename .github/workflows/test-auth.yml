name: Test authentication

# Manual-only check that GitHub can reach BigQuery and can start the Betfair snapshot job.
# The Betfair job runs on Cloud Run in London because Betfair blocks GitHub's US-based runners.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the job request a GitHub login token for Workload Identity Federation

jobs:
  test-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: tennis-predictor-509609

      - name: Test BigQuery access
        run: |
          python - <<'EOF'
          from google.cloud import bigquery
          client = bigquery.Client(project="tennis-predictor-509609", location="EU")
          tables = sorted(t.table_id for t in client.list_tables("tennis-predictor-509609.bronze"))
          print(f"BigQuery OK - bronze has {len(tables)} tables:")
          for t in tables:
              print(f"  {t}")
          EOF

      - name: Run Betfair snapshot job on Cloud Run (London)
        run: |
          gcloud --version | head -1
          gcloud run jobs execute betfair-snapshot --region europe-west2 --wait