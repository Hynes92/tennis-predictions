name: Diagnose scoring

# Manual: checks the scoring path for train/serve differences (parity, A/B symmetry,
# missing features, model loading). Prints model numbers only - no Betfair prices.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: tennis-predictor-509609

      - name: Download latest model
        run: |
          mkdir -p model/latest
          gcloud storage cp "gs://tennis-predictor-509609-models/models/latest/*" model/latest/

      - name: Run diagnostics
        run: python model/diagnose.py --model-dir model/latest