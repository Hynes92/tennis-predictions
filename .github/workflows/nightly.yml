name: Nightly pipeline

# Schedules are in UTC (UK summer time = UTC+1, winter = UTC).
#   21:37 UTC  evening: Betfair snapshot (most of tomorrow's markets are open) -> predictions
#   06:07 UTC  morning: TennisMyLife results + Betfair snapshot -> predictions
# Odd minutes avoid GitHub's busiest (and most delayed) times on the hour.
#
# Flow:  load bronze -> dbt build (everything not depending on ratings)
#        -> ratings (Python) -> dbt build (everything downstream of ratings)
#        -> download latest model -> score upcoming matches -> gold.predictions
#        -> dbt build (prediction ledger)
on:
  schedule:
    - cron: "37 21 * * *"
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      run_tml:
        description: "Load TennisMyLife results"
        type: boolean
        default: true
      run_betfair:
        description: "Take a Betfair snapshot"
        type: boolean
        default: true
      run_models:
        description: "Rebuild features and score upcoming matches"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Never run two pipelines at once; a new run waits for the previous one.
concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

env:
  GCP_PROJECT: tennis-predictor-509609
  MODEL_BUCKET: gs://tennis-predictor-509609-models
  DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt-ci

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements.txt
            ratings/requirements.txt
            model/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r ingestion/requirements.txt -r ratings/requirements.txt -r model/requirements.txt
          pip install "dbt-core>=1.10,<2.0" "dbt-bigquery>=1.10,<2.0"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}

      # ---------------------------------------------------------------- bronze

      # Morning run, or manual run with run_tml ticked
      - name: Load TennisMyLife results (bronze)
        if: github.event.schedule == '7 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.run_tml)
        run: python ingestion/load_tml.py --mode daily

      # Runs on Cloud Run in London because Betfair blocks GitHub's US-based runners.
      # !cancelled() keeps this running even if the TennisMyLife step failed.
      - name: Betfair snapshot (bronze)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_betfair) }}
        run: gcloud run jobs execute betfair-snapshot --region europe-west2 --wait

      # ---------------------------------------------------------------- silver / gold

      # dbt connects with the Workload Identity credentials set up by the auth step.
      - name: Write dbt CI profile
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_models) }}
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'EOF'
          tennis_predictions:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: tennis-predictor-509609
                dataset: dev
                location: EU
                threads: 4
                job_execution_timeout_seconds: 600
                job_retries: 1
          EOF

      - name: dbt build (everything that doesn't depend on ratings)
        id: dbt_pre
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.run_models) }}
        working-directory: tennis_predictions
        run: |
          dbt deps
          dbt build --exclude source:ratings+ source:scoring+

      - name: Compute ratings
        if: ${{ !cancelled() && steps.dbt_pre.outcome == 'success' }}
        id: ratings
        run: python ratings/compute_ratings.py

      - name: dbt build (everything downstream of ratings)
        id: dbt_post
        if: ${{ !cancelled() && steps.ratings.outcome == 'success' }}
        working-directory: tennis_predictions
        run: dbt build --select source:ratings+

      # ---------------------------------------------------------------- predictions

      - name: Download latest model
        id: model
        if: ${{ !cancelled() && steps.dbt_post.outcome == 'success' }}
        run: |
          mkdir -p model/latest
          gcloud storage cp "$MODEL_BUCKET/models/latest/*" model/latest/

      - name: Score upcoming matches
        id: score
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: python model/score.py --model-dir model/latest

      # Rebuild the paper-trading ledger (settles finished matches against TennisMyLife results)
      - name: dbt build (prediction ledger)
        if: ${{ !cancelled() && steps.score.outcome == 'success' }}
        working-directory: tennis_predictions
        run: dbt build --select source:scoring+