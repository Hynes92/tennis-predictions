name: 'tennis_predictions'
version: '0.1.0'
config-version: 2
require-dbt-version: [">=1.10.0", "<2.0.0"]

profile: 'tennis_predictions'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Medallion layout in BigQuery:
#   bronze -> raw tables loaded by the Python ingestion jobs (dbt only reads these, as sources)
#   silver -> staging + intermediate models built by dbt
#   gold   -> features, training sets, predictions
# In dev, datasets get a prefix (dev_silver, dev_gold) so dev work never touches prod.
# See macros/generate_schema_name.sql.
models:
  tennis_predictions:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: table
    marts:
      +schema: gold
      +materialized: table

seeds:
  tennis_predictions:
    +schema: silver
