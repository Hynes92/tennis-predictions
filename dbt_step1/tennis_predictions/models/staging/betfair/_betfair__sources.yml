version: 2

sources:
  - name: betfair
    description: >
      Betfair Exchange snapshots taken by ingestion/load_betfair.py (Cloud Run job, twice daily).
      Append-only: one set of rows per snapshot, identified by _snapshot_id / _snapshot_at.
      Used for upcoming fixtures and for market benchmarking only - never as model features.
    database: "{{ target.project }}"
    schema: bronze
    tables:
      - name: betfair_markets
        description: One row per MATCH_ODDS market per snapshot.
      - name: betfair_price_snapshots
        description: One row per runner (player) per market per snapshot.
