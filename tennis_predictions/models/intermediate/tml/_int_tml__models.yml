version: 2

models:
  - name: int_tml__matches_resolved
    description: >
      stg_tml__matches with every player ID populated. Missing IDs are filled by unambiguous
      name match within the same tour; players never seen with an ID get a temporary
      'tmp_<tour>_<name>' ID, replaced automatically once TML assigns a real one.
    columns:
      - name: match_key
        data_tests:
          - unique
          - not_null
      - name: winner_id
        data_tests:
          - not_null
      - name: loser_id
        data_tests:
          - not_null
      - name: winner_id_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['tml', 'name_match', 'temporary']
      - name: loser_id_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['tml', 'name_match', 'temporary']
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "winner_id != loser_id"

  - name: int_tml__player_matches
    description: >
      One row per player per match (each match appears twice). Base for all player-level
      features. Use match_sequence_key to order a player's matches in time, and
      is_completed_match to exclude walkovers, defaults and abandoned matches from
      ratings and form.
    config:
      cluster_by: ['player_id']
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: match_sequence_key
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['match_key', 'player_id']