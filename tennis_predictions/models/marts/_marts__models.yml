version: 2

models:
  - name: fct_match_features
    description: >
      Training table: one row per completed match, oriented player A vs player B, with pre-match
      features for both players, A-minus-B differences, the label a_won, and data-sufficiency
      columns. Filter on is_training_eligible for model training (2010+, no exhibitions).
    config:
      cluster_by: ['tour', 'tourney_date']
    columns:
      - name: match_key
        data_tests:
          - unique
          - not_null
      - name: a_won
        description: Label. 1 if player A won.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: data_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['full', 'partial', 'thin']
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "player_a_id != player_b_id"
  - name: fct_upcoming_match_features
    description: >
      Upcoming Betfair singles matches with the same feature columns as fct_match_features,
      built from each player's current state. data_tier = 'none' when a player has no TML
      history. market_prob_a is a benchmark only.
    columns:
      - name: market_id
        data_tests:
          - unique
          - not_null
      - name: data_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ['full', 'partial', 'thin', 'none']
  - name: fct_prediction_results
    description: >
      Paper-trading ledger. One row per Betfair market (last prediction before the start),
      settled against TML results. status: pending / settled / void / unsettled.
    columns:
      - name: market_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'settled', 'void', 'unsettled']

  - name: rpt_model_performance
    description: Live model vs market vs Elo, plus paper-trading results, overall and by tier and tour.

  - name: fct_market_benchmark
    description: >
      Out-of-sample model / logistic regression / Elo predictions next to bookmaker closing
      odds (Pinnacle, else Betfair Exchange, else average) for the same matches, oriented to
      player A, with per-match log loss. Odds are benchmark only, never model inputs.
    columns:
      - name: match_key
        tests: [unique, not_null]
      - name: market_prob_a
        tests: [not_null]
  - name: rpt_model_vs_market
    description: >
      Model vs market log loss by period, tour and benchmark source. model_minus_market < 0
      means the model beat the market; ci95_low/high is the paired 95% confidence interval.
  - name: rpt_market_blend
    description: >
      Log loss of market/model blends in log-odds space for model weights 0-1. Choose the
      weight on valid (2024), evaluate on test (2025+). Tests whether the model adds
      information beyond the market.